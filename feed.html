<!DOCTYPE html>
<html>
<head>
  <title>Videx - Home.</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    #mainApp { max-width: 700px; margin: auto; }
    textarea, button, input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .post { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 6px 0; }
    .header { display:flex; justify-content:space-between; }
    .error { color: #b00020; display:none; }
    .star-rating-container { display: flex; gap: 4px; margin: 6px 0; align-items: center; }
    .star-btn { background: none; border: none; padding: 0; width: 30px; height: 30px; cursor: pointer; margin: 0; }
    .star-img { width: 100%; height: 100%; object-fit: contain; }
    .post-stars { display: flex; gap: 4px; margin-top: 8px; border-top: 1px dashed #eee; padding-top: 8px; }
    .post-star-img { width: 20px; height: 20px; object-fit: contain; }
  </style>
</head>
<body>
<div id="mainApp">
  <h2>Videx!</h2>
  <div class="row">
    <input id="nameDisplay" readonly />
    <button id="changeNameBtn" style="background:#00d9ff;border-radius:8px;">Change name</button>
  </div>
  <textarea id="postText" rows="3" placeholder="Write a post..." style="border-radius:10px;"></textarea>
  
  <div class="star-rating-container">
    <span style="font-size: 14px; color: #555; margin-right: 4px;">Rating:</span>
    <button class="star-btn" data-value="1"><img src="IMG_2372.jpeg" class="star-img" alt="1" /></button>
    <button class="star-btn" data-value="2"><img src="IMG_2372.jpeg" class="star-img" alt="2" /></button>
    <button class="star-btn" data-value="3"><img src="IMG_2372.jpeg" class="star-img" alt="3" /></button>
    <button class="star-btn" data-value="4"><img src="IMG_2372.jpeg" class="star-img" alt="4" /></button>
    <button class="star-btn" data-value="5"><img src="IMG_2372.jpeg" class="star-img" alt="5" /></button>
  </div>

  <button id="postBtn" style="background:black;color:white;border-radius:20px;">Post</button>
  <div id="errorBox" class="error"></div>
  <button id="refreshBtn">Refresh Page</button>
  <div id="feed"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = "https://btpeyadbqscxejitjopi.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0cGV5YWRicXNjeGVqaXRqb3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjIzOTQsImV4cCI6MjA3OTM5ODM5NH0.u2Sj-oObFRfPWbtn-Wvr2PbJmxcciucdHcgzyiSCCTg";
const supabase = createClient(supabaseUrl, supabaseKey);

const nameDisplay = document.getElementById("nameDisplay");
const changeNameBtn = document.getElementById("changeNameBtn");
const postText = document.getElementById("postText");
const postBtn = document.getElementById("postBtn");
const refreshBtn = document.getElementById("refreshBtn");
const errorBox = document.getElementById("errorBox");
const feedEl = document.getElementById("feed");
const starButtons = document.querySelectorAll(".star-btn");

let currentUserName = (localStorage.getItem("videxName") || "").trim();
if (!currentUserName) window.location.href = "login.html";
else nameDisplay.value = currentUserName;

let selectedRating = 0;

const UNCHECKED_STAR = "IMG_2372.jpeg";
const CHECKED_STAR = "IMG_2373.jpeg";

starButtons.forEach(button => {
  button.addEventListener("click", () => {
    const clickedValue = parseInt(button.getAttribute("data-value"), 10);
    
    if (selectedRating === clickedValue) {
      selectedRating = 0;
    } else {
      selectedRating = clickedValue;
    }
    
    updateInputStars();
  });
});

function updateInputStars() {
  starButtons.forEach(button => {
    const val = parseInt(button.getAttribute("data-value"), 10);
    const img = button.querySelector(".star-img");
    if (val <= selectedRating) {
      img.src = CHECKED_STAR;
    } else {
      img.src = UNCHECKED_STAR;
    }
  });
}

changeNameBtn.addEventListener("click", () => {
  const newName = prompt("Enter new name:", currentUserName) || "";
  const trimmed = newName.trim();
  if (!trimmed) return;
  currentUserName = trimmed;
  localStorage.setItem("videxName", trimmed);
  nameDisplay.value = trimmed;
});

postBtn.addEventListener("click", async () => {
  clearError();
  const text = (postText.value || "").trim();
  if (!text) { showError("Please write something."); return; }
  
  // Custom prefix storage strategy to safely handle regular text table properties 
  const payloadText = "RATING_V1:" + selectedRating + ":" + text;

  const { error } = await supabase.from("posts").insert([{ username: currentUserName, text: payloadText }]);
  if (error) { showError("Post error: "+error.message); return; }
  
  postText.value = "";
  selectedRating = 0;
  updateInputStars();
  await loadPosts();
});

refreshBtn.addEventListener("click", loadPosts);

async function loadPosts() {
  clearError();
  feedEl.innerHTML = "<div class='post'>Loading...</div>";
  const { data, error } = await supabase.from("posts").select("*").order("created_at",{ascending:false}).limit(100);
  if (error) { showError("Load error: "+error.message); feedEl.innerHTML=""; return; }
  feedEl.innerHTML = "";
  
  data.forEach(post => {
    let displayBody = post.text || "";
    let postRating = 0;

    // Check if the post uses our custom text tracking format
    if (displayBody.startsWith("RATING_V1:")) {
      const parts = displayBody.split(":");
      // parts[0] is 'RATING_V1', parts[1] is the rating value
      postRating = parseInt(parts[1], 10) || 0;
      // Re-join the remaining parts to construct the original post body safely
      displayBody = parts.slice(2).join(":");
    }

    const div = document.createElement("div");
    div.className = "post";
    const time = new Date(post.created_at).toLocaleString();
    
    // Only compile star container under posts if rating is above 0
    let starsHtml = '';
    if (postRating > 0) {
      starsHtml = '<div class="post-stars">';
      for (let i = 1; i <= 5; i++) {
        const starSrc = i <= postRating ? CHECKED_STAR : UNCHECKED_STAR;
        starsHtml += `<img src="${starSrc}" class="post-star-img" alt="${i} star" />`;
      }
      starsHtml += '</div>';
    }

    div.innerHTML = `<div class="header"><strong>${escapeHtml(post.username)}</strong><span style="color:#666">${escapeHtml(time)}</span></div><div>${escapeHtml(displayBody)}</div>${starsHtml}`;
    feedEl.appendChild(div);
  });
}

function showError(msg){ errorBox.textContent=msg; errorBox.style.display="block"; }
function clearError(){ errorBox.textContent=""; errorBox.style.display="none"; }
function escapeHtml(str){ return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

loadPosts();
</script>
</body>
