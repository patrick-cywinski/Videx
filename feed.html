<!DOCTYPE html>
<html>
<head>
  <title>Videx - Home.</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    #mainApp { max-width: 700px; margin: auto; }
    textarea, button, input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .post { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 6px 0; }
    .header { display:flex; justify-content:space-between; }
    .error { color: #b00020; display:none; }
    
    /* Star styling inside each individual post card */
    .post-rating-container { display: flex; gap: 4px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #eee; align-items: center; }
    .post-star-btn { background: none; border: none; padding: 0; width: 24px; height: 24px; cursor: pointer; margin: 0; }
    .post-star-img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
<div id="mainApp">
  <h2>Videx!</h2>
  <div class="row">
    <input id="nameDisplay" readonly />
    <button id="changeNameBtn" style="background:#00d9ff;border-radius:8px;">Change name</button>
  </div>
  <textarea id="postText" rows="3" placeholder="Write a post..." style="border-radius:10px;"></textarea>
  <button id="postBtn" style="background:black;color:white;border-radius:20px;">Post</button>
  <div id="errorBox" class="error"></div>
  <button id="refreshBtn">Refresh Page</button>
  <div id="feed"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = "https://btpeyadbqscxejitjopi.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0cGV5YWRicXNjeGVqaXRqb3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjIzOTQsImV4cCI6MjA3OTM5ODM5NH0.u2Sj-oObFRfPWbtn-Wvr2PbJmxcciucdHcgzyiSCCTg";
const supabase = createClient(supabaseUrl, supabaseKey);

const nameDisplay = document.getElementById("nameDisplay");
const changeNameBtn = document.getElementById("changeNameBtn");
const postText = document.getElementById("postText");
const postBtn = document.getElementById("postBtn");
const refreshBtn = document.getElementById("refreshBtn");
const errorBox = document.getElementById("errorBox");
const feedEl = document.getElementById("feed");

let currentUserName = (localStorage.getItem("videxName") || "").trim();
if (!currentUserName) window.location.href = "login.html";
else nameDisplay.value = currentUserName;

const UNCHECKED_STAR = "IMG_2372.jpeg";
const CHECKED_STAR = "IMG_2373.jpeg";

changeNameBtn.addEventListener("click", () => {
  const newName = prompt("Enter new name:", currentUserName) || "";
  const trimmed = newName.trim();
  if (!trimmed) return;
  currentUserName = trimmed;
  localStorage.setItem("videxName", trimmed);
  nameDisplay.value = trimmed;
});

postBtn.addEventListener("click", async () => {
  clearError();
  const text = (postText.value || "").trim();
  if (!text) { showError("Please write something."); return; }
  const { error } = await supabase.from("posts").insert([{ username: currentUserName, text }]);
  if (error) { showError("Post error: "+error.message); return; }
  postText.value = "";
  await loadPosts();
});

refreshBtn.addEventListener("click", loadPosts);

async function loadPosts() {
  clearError();
  feedEl.innerHTML = "<div class='post'>Loading...</div>";
  const { data, error } = await supabase.from("posts").select("*").order("created_at",{ascending:false}).limit(100);
  if (error) { showError("Load error: "+error.message); feedEl.innerHTML=""; return; }
  feedEl.innerHTML = "";
  
  data.forEach(post => {
    const div = document.createElement("div");
    div.className = "post";
    const time = new Date(post.created_at).toLocaleString();
    
    // The stars are built right here, directly inside each post card block
    div.innerHTML = `
      <div class="header">
        <strong>${escapeHtml(post.username)}</strong>
        <span style="color:#666">${escapeHtml(time)}</span>
      </div>
      <div style="margin-top: 4px;">${escapeHtml(post.text)}</div>
      <div class="post-rating-container">
        <button class="post-star-btn" data-star="1"><img src="${UNCHECKED_STAR}" class="post-star-img" alt="1" /></button>
        <button class="post-star-btn" data-star="2"><img src="${UNCHECKED_STAR}" class="post-star-img" alt="2" /></button>
        <button class="post-star-btn" data-star="3"><img src="${UNCHECKED_STAR}" class="post-star-img" alt="3" /></button>
        <button class="post-star-btn" data-star="4"><img src="${UNCHECKED_STAR}" class="post-star-img" alt="4" /></button>
        <button class="post-star-btn" data-star="5"><img src="${UNCHECKED_STAR}" class="post-star-img" alt="5" /></button>
      </div>
    `;

    // Local variable tracker unique to this specific card instance
    let currentPostRating = 0;
    const postStarButtons = div.querySelectorAll(".post-star-btn");

    postStarButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const targetVal = parseInt(btn.getAttribute("data-star"), 10);
        
        // If they click the same star level again, it toggles back down to 0
        if (currentPostRating === targetVal) {
          currentPostRating = 0;
        } else {
          currentPostRating = targetVal;
        }

        // Apply checked/unchecked image paths strictly within this card element
        postStarButtons.forEach(innerBtn => {
          const checkVal = parseInt(innerBtn.getAttribute("data-star"), 10);
          const img = innerBtn.querySelector(".post-star-img");
          if (checkVal <= currentPostRating) {
            img.src = CHECKED_STAR;
          } else {
            img.src = UNCHECKED_STAR;
          }
        });
      });
    });

    feedEl.appendChild(div);
  });
}

function showError(msg){ errorBox.textContent=msg; errorBox.style.display="block"; }
function clearError(){ errorBox.textContent=""; errorBox.style.display="none"; }
function escapeHtml(str){ return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

loadPosts();
</script>
</body>
</html>
